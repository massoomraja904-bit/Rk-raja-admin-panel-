<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} - RK RAJA XWD</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: "Courier New", monospace;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
        }

        h1 {
            margin-top: 25px;
            color: #ff00ff;
            font-size: 30px;
            text-shadow:
                0 0 5px #ff00ff,
                0 0 15px #ff00ff;
        }

        .line {
            width: 90%;
            height: 2px;
            margin: 20px auto;
            background: #00ffff;
            box-shadow: 0 0 12px #00ffff;
        }

        .card {
            margin: 25px auto;
            padding: 25px 20px;
            border: 2px solid #00ffff;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 18px #00ffff;
        }

        .card h2 {
            color: #00ffff;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .card p {
            color: #ccc;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin: 15px 0;
            padding: 10px 20px;
            border: 1px solid #00ff00;
            border-radius: 6px;
            color: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            font-weight: bold;
        }

        .back-btn {
            display: block;
            width: 90%;
            max-width: 500px;
            margin: 25px auto;
            padding: 13px;
            background: #00ffff;
            color: #000;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            box-shadow: 0 0 12px #00ffff;
        }

        .back-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px #00ffff;
        }

        footer {
            margin-top: 40px;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 23px;
            }

            .card {
                padding: 20px 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>𝐑𝐊 𝐑𝐀𝐉𝐀 𝐗𝐖𝐃</h1>

    <div class="line"></div>

    <div class="card">

        <h2>{{ title }}</h2>

        <div class="status">
            ● FEATURE READY
        </div>

        <p>
            Section ID:
            <strong>{{ section_id }}</strong>
        </p>

        <p>
            Is section ka interface ready hai.
            Yahan aap apni authorized functionality add kar sakte ho.
        </p>

    </div>

    <a class="back-btn" href="/">
        ◄ BACK TO HOME ►
    </a>

    <footer>
        © 2026 𝐑𝐊 𝐑𝐀𝐉𝐀 𝐗𝐖𝐃
    </footer>

</div>

</body>
</html>
